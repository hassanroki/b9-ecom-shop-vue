<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Lotus Petal Color Gradients -->
    <linearGradient id="pRedDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A8101E"/>
      <stop offset="100%" stop-color="#E52D27"/>
    </linearGradient>
    <linearGradient id="pRedLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="pOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <linearGradient id="pYellow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>

    <!-- Green Hills Color Gradients -->
    <linearGradient id="hDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005B41"/>
      <stop offset="100%" stop-color="#008156"/>
    </linearGradient>
    <linearGradient id="hMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008E5A"/>
      <stop offset="100%" stop-color="#10AC66"/>
    </linearGradient>
    <linearGradient id="hLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25C26E"/>
      <stop offset="100%" stop-color="#5CDA8B"/>
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="river" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2F1"/>
    </linearGradient>

    <!-- Cart Gradient -->
    <linearGradient id="cartG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005C6E"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
  </defs>

  <g id="logo-mark">
    <!-- LOTUS PETALS -->
    <g id="petals">
      <path d="M 250 250 Q 150 270 70 240 Q 130 190 250 250 Z" fill="url(#pRedDark)"/>
      <path d="M 250 250 Q 350 270 430 240 Q 370 190 250 250 Z" fill="url(#pRedDark)"/>
      <path d="M 250 250 Q 130 230 100 160 Q 180 135 250 250 Z" fill="url(#pRedLight)"/>
      <path d="M 250 250 Q 370 230 400 160 Q 320 135 250 250 Z" fill="url(#pRedLight)"/>
      <path d="M 250 250 Q 140 160 130 80 Q 210 85 250 250 Z" fill="url(#pOrange)"/>
      <path d="M 250 250 Q 360 160 370 80 Q 290 85 250 250 Z" fill="url(#pOrange)"/>
      <path d="M 250 250 Q 170 100 200 45 Q 245 70 250 250 Z" fill="url(#pYellow)"/>
      <path d="M 250 250 Q 330 100 300 45 Q 255 70 250 250 Z" fill="url(#pYellow)"/>
      <path d="M 250 250 Q 215 110 250 20 Z" fill="#D32F2F"/>
      <path d="M 250 250 Q 285 110 250 20 Z" fill="url(#pYellow)"/>
      <polygon points="250,70 255,83 269,83 258,92 262,105 250,96 238,105 242,92 231,83 245,83" fill="#FFFFFF"/>
    </g>

    <!-- GREEN HILLS & RIVER -->
    <g id="hills">
      <path d="M 50 250 C 40 370 120 460 250 460 C 380 460 460 370 450 250 C 380 320 320 330 250 330 C 180 330 120 320 50 250 Z" fill="url(#hDark)"/>
      <path d="M 50 250 C 100 300 180 320 250 330 C 200 410 100 420 50 250 Z" fill="url(#hMid)"/>
      <path d="M 450 250 C 400 300 320 320 250 330 C 300 410 400 420 450 250 Z" fill="url(#hMid)"/>
      <path d="M 50 250 Q 160 300 250 330 Q 150 360 50 250 Z" fill="url(#hLight)" opacity="0.8"/>
      <path d="M 450 250 Q 340 300 250 330 Q 350 360 450 250 Z" fill="url(#hLight)" opacity="0.8"/>
      <path d="M 250 330 C 220 350 280 380 230 420 C 200 440 170 450 160 458 C 190 460 220 460 250 460 C 280 460 310 458 310 458 C 290 440 310 410 260 380 C 230 360 265 345 250 330 Z" fill="url(#river)"/>
    </g>

    <!-- SHOPPING CART -->
    <g id="shopping-cart">
      <path d="M 125 175 L 170 175 L 205 275 L 305 275 C 315 275 325 265 330 250 L 345 190 L 160 190" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 125 175 L 170 175 L 205 275 L 305 275 C 315 275 325 265 330 250 L 345 190 L 160 190" fill="none" stroke="url(#cartG)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 175 200 L 335 200 L 318 250 C 315 258 308 262 300 262 L 200 262 Z" fill="#00695C"/>
      <path d="M 210 250 L 210 225 C 210 215 225 215 225 225 L 225 250 Z" fill="#FFFFFF"/>
      <path d="M 242 250 L 242 225 C 242 215 257 215 257 225 L 257 250 Z" fill="#FFFFFF"/>
      <path d="M 289 250 L 289 225 C 289 215 274 215 274 225 L 274 250 Z" fill="#FFFFFF"/>
      <circle cx="215" cy="310" r="16" fill="#FFFFFF"/>
      <circle cx="215" cy="310" r="11" fill="#005C6E"/>
      <circle cx="285" cy="310" r="16" fill="#FFFFFF"/>
      <circle cx="285" cy="310" r="11" fill="#005C6E"/>
    </g>
  </g>
</svg>
